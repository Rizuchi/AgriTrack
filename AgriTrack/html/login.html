<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">

<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="overlay"></div>

        <div class="left-content">
            <p class="tagline">YOUR SMART FARMING COMPANION</p>

            <h1>
                Gabay sa Malusog na<br>
                Pananim at Masaganang Ani.
            </h1>

            <div class="bottom-text">
                <p>Grow Smart with <strong>AGRITRACK</strong></p>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <h2>Maligayang Pagbabalik sa AgriTrack!</h2>

        <p class="subtitle">
            Welcome Back to AgriTrack! Ilagay ang iyong kredensyal upang ma-access ang iyong account.
        </p>

        <form id="loginForm">

            <div class="field">
                <label>Pangalan ng Gumagamit</label>
                <input type="text" name="userName" id="userName" placeholder="Username" required>
            </div>

            <div class="field">
                <label>Password</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" name="password" id="password" placeholder="Password" required style="width: 100%; padding-right: 48px; box-sizing: border-box;">
                    <button type="button" class="toggle-password" data-target="password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #14532d; font-size: 1rem;" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Tandaan ang Password</label>
            </div>

            <p id="message"></p>

            <button type="submit" class="login-btn">
                MAG-LOG IN
            </button>

        </form>

        <p class="register-link">
            Wala ka pang account?
            <a href="registration.html">Gumawa ng Account.</a>
        </p>

    </div>

</div>

<script src="../js/login.js"></script>
</body>
</html>
